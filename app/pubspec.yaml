name: videomilla
description: VideoMilla turns a sentence, a script or a drawing into a narrated, captioned video made of shots.
publish_to: none
version: 0.1.0+1

# Pinned exactly at gate G3 (see docs/decision.md D-020, D-021). Nothing floats.
environment:
  sdk: '>=3.13.7 <3.14.0'
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: 4.6.0
  crypto: 3.0.8
  file_picker: 13.3.2
  flutter_secure_storage: 11.2.0
  flutter_tts: 4.2.5
  google_sign_in: 7.2.0
  http: 1.6.0
  image: 4.12.0
  image_picker: 1.2.4
  in_app_purchase: 3.3.1
  intl: 0.20.3
  package_info_plus: 10.2.2
  path: 1.9.1
  path_provider: 2.1.6
  phosphor_flutter: 2.1.0
  share_plus: 13.3.1
  sqflite: 2.4.5
  url_launcher: 6.3.3
  uuid: 4.6.0
  video_player: 2.14.1
  wakelock_plus: 1.8.2
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8

flutter:
  generate: true
  uses-material-design: false
