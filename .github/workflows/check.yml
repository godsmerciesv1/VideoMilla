# Light check. Manual only (no push trigger, ever: blueprint Section 12).
# No app build, no signing. Each job skips itself until its folder exists.
# Logs (and the Dart lockfile) are published to the branches ci-logs-app / ci-logs-worker
# so results can be read without downloading artifacts.
name: check
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to check'
        type: choice
        default: all
        options: [all, repo, app, worker]
jobs:
  repo:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'repo' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/guard.py

  app:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f app/pubspec.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No app/pubspec.yaml yet: skipping"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
      - name: Resolve, generate strings, analyze
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: |
          mkdir -p ../ci-out
          flutter --version 2>&1 | tee ../ci-out/version.log
          flutter pub get 2>&1 | tee ../ci-out/pub_get.log
          flutter gen-l10n 2>&1 | tee ../ci-out/gen_l10n.log
          # Blueprint Section 27: errors fail the batch; warnings and infos are tolerated (and shown).
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-out/analyze.log
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: |
          if [ -d test ] && ls test/*_test.dart >/dev/null 2>&1; then flutter test 2>&1 | tee ../ci-out/test.log; else echo "No Dart tests yet" | tee ../ci-out/test.log; fi
      - name: Publish logs and lockfile
        if: always() && steps.detect.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out && [ -f app/pubspec.lock ] && cp app/pubspec.lock ci-out/pubspec.lock || true
          cd ci-out
          for f in *.log; do [ -f "$f" ] && tail -c 150000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          echo "commit ${{ github.sha }}" > source.txt
          git init -q -b ci-logs-app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "app check logs for ${{ github.sha }}" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs-app

  worker:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'worker' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f worker/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No worker/package.json yet: skipping"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, typecheck, test
        if: steps.detect.outputs.present == 'true'
        working-directory: worker
        run: |
          mkdir -p ../ci-out
          npm install 2>&1 | tee ../ci-out/npm_install.log
          npm run typecheck 2>&1 | tee ../ci-out/typecheck.log
          npm test 2>&1 | tee ../ci-out/test.log
      - name: Publish logs
        if: always() && steps.detect.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out && cd ci-out
          for f in *.log; do [ -f "$f" ] && tail -c 150000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          echo "commit ${{ github.sha }}" > source.txt
          git init -q -b ci-logs-worker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "worker check logs for ${{ github.sha }}" || true
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs-worker
